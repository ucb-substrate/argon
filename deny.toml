[licenses]
# Permissive and weak-copyleft licenses compatible with distributing Argon
# under BSD-3-Clause. MPL dependencies retain their file-level MPL terms.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Substrate's private registry packages and source repository omit per-package
# license metadata; both are covered by Substrate's repository-level BSD-3-Clause
# license.
ignore = true
registries = ["https://github.com/substrate-labs/crates-index"]
ignore-sources = [
    "https://github.com/substrate-labs/crates-index",
    "https://github.com/ucb-substrate/substrate2.git",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "https://github.com/substrate-labs/crates-index",
]

[sources.allow-org]
github = ["ucb-substrate", "zed-industries"]
