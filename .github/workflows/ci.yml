name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Argon examples
        run: |
          cargo build -p argon --bin arc
          find examples -name Argon.toml -exec target/debug/arc fmt --check --manifest-path {} \;

  # Lint
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --no-deps -- -D warnings

  # Build and test
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ matrix.rust }}
          cache-on-failure: true
      
      - name: Run tests
        run: cargo test --release --workspace

  # Documentation link checking, split in two so a docs-only change gets fast
  # feedback instead of waiting on a full workspace build.
  markdown-links:
    name: Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Validates relative file and image paths and in-page `#heading` anchors
      # across every Markdown file. Settings live in `lychee.toml` so that a
      # local `lychee --config lychee.toml '**/*.md'` reproduces this exactly.
      # External http(s) links are intentionally not checked -- see that file.
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --no-progress '**/*.md'
          fail: true

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Enforces `[workspace.lints.rustdoc]` from Cargo.toml, which denies
      # broken intra-doc links among others. Two flags matter here:
      #   --document-private-items  most of this workspace is private, and
      #                             without it rustdoc skips those items and
      #                             their doc links entirely, checking almost
      #                             nothing.
      #   --lib                     skips the `argon` package's four one-line
      #                             bin wrappers, whose target names collide
      #                             with the libraries they re-export
      #                             (rust-lang/cargo#6313). They carry no doc
      #                             comments, so no coverage is lost.
      - name: Check Rust doc links
        run: cargo doc --workspace --no-deps --lib --document-private-items

  # Checks if dependencies have incompatible licenses or known vulnerabilties
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install security tools
        run: cargo install cargo-audit cargo-deny --locked
      
      - name: Run security audit
        run: cargo audit

      - name: Check dependency licenses and sources
        run: cargo deny check licenses sources
