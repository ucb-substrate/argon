[package]
name = "argone"
version = "0.1.0"
edition = "2024"
license.workspace = true
autobins = false

[lib]
name = "argone"

[dependencies]
analyzer = { package = "argon-analyzer", path = "../analyzer" }
argonc = { path = "../compiler" }
gpui = { git = "https://github.com/ucb-substrate/zed", branch = "argon-dev" }
anyhow = { workspace = true }
smallvec = "1"
rust-embed = "8"
lazy_static = "1"
itertools = { workspace = true }
clap = { workspace = true }
arcstr = { workspace = true }
cfgrammar = { workspace = true }
enumify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tarpc = { workspace = true }
async-compat = "0.2"
futures = { workspace = true }
tokio = { version = "1", features = ["net"] }
geometry = { version = "0.7.1", registry = "substrate" }
indexmap = { workspace = true }
rgb = { version = "0.8", features = ["serde"] }
unicode-segmentation = "1"
tower-lsp-server = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSRunningApplication",
    "NSWorkspace",
] }

[dev-dependencies]
approx = { workspace = true }
gpui = { git = "https://github.com/ucb-substrate/zed", branch = "argon-dev", features = ["test-support"] }
