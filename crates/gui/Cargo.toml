[package]
name = "argone"
version = "0.1.0"
edition = "2024"
license.workspace = true
autobins = false

[lints]
workspace = true

[lib]
name = "argone"

[dependencies]
protocol = { package = "argon-protocol", path = "../protocol" }
ls-types = "0.0.6"
web-time = "1"
postcard = { workspace = true }
argonc = { path = "../compiler" }
gpui = { git = "https://github.com/ucb-substrate/zed", branch = "argon-dev" }
gpui_platform = { git = "https://github.com/ucb-substrate/zed", branch = "argon-dev", default-features = false, features = [
    "font-kit",
    "wayland",
    "x11",
] }
anyhow = { workspace = true }
smallvec = "1"
rust-embed = "8"
lazy_static = "1"
itertools = { workspace = true }
arcstr = { workspace = true }
cfgrammar = { workspace = true }
enumify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tarpc = { workspace = true }
futures = { workspace = true }
geometry = { version = "0.7.1", registry = "substrate" }
indexmap = { workspace = true }
imbl = "7.0.1"
image = { version = "0.25", default-features = false }
rgb = { version = "0.8", features = ["serde"] }
unicode-segmentation = "1"
tracing = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
analyzer = { package = "argon-analyzer", path = "../analyzer" }
async-compat = "0.2"
clap = { workspace = true }
rmpv = "1"
tempfile = { workspace = true }
tokio = { version = "1", features = ["net"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSRunningApplication",
    "NSWorkspace",
] }

[dev-dependencies]
approx = { workspace = true }
gpui = { git = "https://github.com/ucb-substrate/zed", branch = "argon-dev", features = ["test-support"] }
